<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NPI 2026 Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img class="logo" src="assets/liberty-business-logo.png" alt="Liberty Business" />
    <div class="titleblock">
      <div class="eyebrow">B2B GTM Team</div>
      <h1 id="productName">Apple NPI 2026</h1>
    </div>
  </div>
  <div class="dates">
    <div class="date-chip"><div class="label">Announcement</div><div class="value" id="dAnnounce">—</div></div>
    <div class="date-chip"><div class="label">Pre-Order</div><div class="value" id="dPreorder">—</div></div>
    <div class="date-chip"><div class="label">Official Launch</div><div class="value" id="dLaunch">—</div></div>
  </div>
</div>

<div class="summary-bar" id="summaryBar"></div>

<main id="main">
  <div class="empty-state">Loading tracker...</div>
</main>

<div class="toolbar">
  <span class="viewer-badge" id="lastUpdated">View only — data refreshes when the tracker owner publishes an update</span>
</div>

<script src="app.js"></script>
<script>
  let data = null;
  let currentQuery = "";

  function paintMeta() {
    document.getElementById("productName").textContent = data.meta.productName;
    document.getElementById("dAnnounce").textContent = data.meta.announcementDate;
    document.getElementById("dPreorder").textContent = data.meta.preOrderRange;
    document.getElementById("dLaunch").textContent = data.meta.launchDate;
    if (data.meta.lastUpdated) {
      const d = new Date(data.meta.lastUpdated);
      document.getElementById("lastUpdated").textContent = "Last updated " + d.toLocaleString();
    }
  }

  function paint() {
    paintMeta();
    renderSummary(document.getElementById("summaryBar"), data.meta, data.rows);
    renderView(document.getElementById("main"), data.meta, data.rows, currentQuery);
    const search = document.getElementById("searchInput");
    if (search) {
      search.value = currentQuery;
      search.oninput = e => {
        currentQuery = e.target.value;
        renderView(document.getElementById("main"), data.meta, data.rows, currentQuery);
      };
    }
  }

  (async function init() {
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      data = await res.json();
      paint();
    } catch (e) {
      document.getElementById("main").innerHTML =
        '<div class="empty-state">Could not load data.json. Make sure this file sits next to view.html, app.js, and styles.css.</div>';
    }
  })();
</script>
</body>
</html>
